name: iOS

on:
  push:
    branches: ["main", "feature/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # The project is developed and verified on Xcode 26 (iOS 26 SDK, see ios/README.md);
        # prefer the newest Xcode 26 on the runner and only fall back to 16.x.
        run: |
          ls -d /Applications/Xcode*.app
          pick=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$pick" ] || pick=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $pick"
          sudo xcode-select -s "$pick"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone' | head -20
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for v in json.load(sys.stdin)["devices"].values() for d in v if d.get("isAvailable") and d["name"].startswith("iPhone")]
          devices.sort(key=lambda d: (("Pro" in d["name"]) or ("Plus" in d["name"]) or ("Max" in d["name"]) or ("SE" in d["name"]) or ("e" in d["name"].split()[-1]), d["name"]))
          print(devices[0]["udid"] if devices else "")')
          test -n "$udid" || { echo "no available iPhone simulator"; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator $udid"
          xcrun simctl boot "$udid" || true

      - name: Start workspace fixture server
        working-directory: ios
        run: |
          # KeJiUITests/WorkspaceFlowTests drive the real HTTP stack against this local
          # contract fixture (127.0.0.1:18768); without it every HTTP scenario fails.
          nohup python3 TestSupport/workspace_server.py > fixture-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:18768/ci/content/version && break
            sleep 0.5
          done
          curl -s http://127.0.0.1:18768/ci/content/version | head -c 200; echo

      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project KeJi.xcodeproj -scheme KeJi \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            build test CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log \
            | grep -E --line-buffered 'error:|warning: .*(sign|provision)|Test Case .* failed|Test Suite .* (passed|failed)|Executed [0-9]+ tests|Failing tests|BUILD (SUCCEEDED|FAILED)|TEST (SUCCEEDED|FAILED)|xcodebuild: (error|WARNING)'

      - name: Show failing assertions
        if: failure()
        working-directory: ios
        run: |
          grep -E 'swift:[0-9]+: error|Test Case .* failed \(|Failing tests|^\s+[A-Za-z]+Tests\.[a-zA-Z]+\(\)' xcodebuild.log | head -100 || true

      - name: Upload test results and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeJi-test-results
          path: |
            ios/TestResults.xcresult
            ios/fixture-server.log
            ios/xcodebuild.log
          if-no-files-found: warn

      - name: Zip app
        working-directory: ios
        run: |
          cd DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent KeJi.app KeJi-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KeJi-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/KeJi-simulator.zip
          if-no-files-found: error
