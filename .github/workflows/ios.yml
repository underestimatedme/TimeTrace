name: iOS

on:
  push:
    branches: ["main", "feature/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project KeJi.xcodeproj -scheme KeJi \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            build test CODE_SIGNING_ALLOWED=NO | tail -200

      - name: Upload test results and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeJi-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: warn

      - name: Zip app
        working-directory: ios
        run: |
          cd DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent KeJi.app KeJi-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KeJi-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/KeJi-simulator.zip
          if-no-files-found: error
