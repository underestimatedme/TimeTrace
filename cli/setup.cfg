# Metadata lives here (not in pyproject [project]) so that the setuptools
# shipped with macOS's Python 3.9 can build it as well as pipx can.
[metadata]
name = keji
version = attr: keji.__version__
description = 刻迹 (KeJi) computer-side runner: quota-aware, zero-spend task execution for Claude Code and Codex
long_description = file: README.md
long_description_content_type = text/markdown
author = 刻迹 contributors
license = Apache-2.0
license_files = LICENSE
classifiers =
    License :: OSI Approved :: Apache Software License
    Operating System :: MacOS
    Programming Language :: Python :: 3

[options]
packages = find:
python_requires = >=3.9

[options.packages.find]
include =
    keji
    keji.*

[options.entry_points]
console_scripts =
    keji = keji.cli:main
