name: KeJi
options:
  bundleIdPrefix: com.atlaspaces
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.5"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "2026092401"
    MARKETING_VERSION: "0.1.0"
targets:
  KeJi:
    type: application
    platform: iOS
    sources:
      - path: KeJi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlaspaces.timetrace
        PRODUCT_NAME: KeJi
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: KeJi/Resources/Info.plist
      properties:
        CFBundleDisplayName: TimeTrace
        CFBundleName: TimeTrace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        KEJI_API_BASE_URL: https://apis.atlaspaces.com/timetrace/api/v1
  KeJiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeJiTests
    dependencies:
      - target: KeJi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlaspaces.keji.tests
        GENERATE_INFOPLIST_FILE: "YES"
  KeJiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KeJiUITests
    dependencies:
      - target: KeJi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlaspaces.keji.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  KeJi:
    build:
      targets:
        KeJi: all
        KeJiTests: [test]
        KeJiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      environmentVariables:
        KEJI_OFFLINE: "1"
      targets:
        - KeJiTests
        - KeJiUITests
